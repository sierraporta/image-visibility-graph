[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "image-visibility-graph"
version = "0.1.0"
description = "Image Visibility Graphs (IVG/IHVG) and Visibility Patches (Iacovacci & Lacasa, 2019)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "David Sierra Porta" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]
keywords = ["visibility graph", "image processing", "complex networks", "texture", "feature extraction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/sierraporta/image-visibility-graph"
Issues = "https://github.com/sierraporta/image-visibility-graph/issues"

[project.optional-dependencies]
extras = ["networkx", "scipy", "pandas", "opencv-python", "pillow"]
test = ["pytest", "networkx", "scipy"]
examples = ["matplotlib", "jupyter"]

[tool.setuptools]
packages = ["ivg"]
